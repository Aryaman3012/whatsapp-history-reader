<!DOCTYPE html>
<!-- SPIKE: prototype quality — see hardening list before reuse -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp History Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e14;
    --bg-panel: #10141c;
    --bg-raised: #151a24;
    --bg-hover: #1a2029;
    --border: #222937;
    --border-soft: #1b2130;
    --text: #e3e7ee;
    --text-dim: #8b95a7;
    --accent: #3ec9ae;
    --accent-dim: #2a9a86;
    --accent-soft: rgba(62, 201, 174, 0.12);
    --bubble-me: #17342f;
    --bubble-other: #171c26;
    --font-ui: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13.5px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 6px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: #303a4c; }

  #topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #topbar h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }
  #topbar h1::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 3px;
    background: var(--accent);
    flex-shrink: 0;
  }
  #stats {
    display: flex;
    gap: 18px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #stats b { color: var(--text); font-weight: 500; }

  #main { display: flex; flex: 1; min-height: 0; }

  #sidebar {
    width: 320px;
    min-width: 220px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  #connstatus {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #connstatus .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #connstatus.connected .dot {
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #connstatus.connected { color: var(--accent); }
  #qr-btn {
    background: var(--accent);
    border: none;
    color: #06231c;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  #qr-btn:hover { background: #55d6bc; }
  #qr-btn:active { transform: scale(0.97); }
  #qr-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #searchbox {
    padding: 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  #searchbox input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  #searchbox input[type="text"]::placeholder { color: var(--text-dim); }
  #searchbox input[type="text"]:focus {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #filter-saved {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    transition: color 0.18s ease;
  }
  #filter-saved:hover { color: var(--text); }
  #filter-saved input { accent-color: var(--accent); cursor: pointer; }
  #filter-saved input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chat-pn {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 11px;
    margin-left: 6px;
    font-family: var(--font-mono);
  }

  #chatlist { flex: 1; overflow-y: auto; padding: 4px 0; }
  .chat-item {
    padding: 10px 14px;
    margin: 1px 6px;
    border-radius: 8px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chat-item:hover { background: var(--bg-hover); }
  .chat-item.active {
    background: var(--bg-raised);
    border-left-color: var(--accent);
  }
  .chat-name {
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.005em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-preview {
    color: var(--text-dim);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 3px;
  }
  .chat-time {
    color: var(--text-dim);
    font-size: 11px;
    float: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 400;
    margin-left: 8px;
  }

  #panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #panel-header {
    padding: 13px 20px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: -0.01em;
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .msg {
    max-width: 65%;
    padding: 9px 13px;
    border-radius: 12px;
    word-wrap: break-word;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 13.5px;
  }
  .msg.me {
    align-self: flex-end;
    background: var(--bubble-me);
    border: 1px solid rgba(62, 201, 174, 0.14);
    border-bottom-right-radius: 4px;
  }
  .msg.other {
    align-self: flex-start;
    background: var(--bubble-other);
    border: 1px solid var(--border-soft);
    border-bottom-left-radius: 4px;
  }
  .msg .sender {
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .msg .time {
    color: var(--text-dim);
    font-size: 10.5px;
    margin-top: 4px;
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .msg .badge {
    display: inline-block;
    background: var(--bg-raised);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .date-sep {
    align-self: center;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 11px;
    font-family: var(--font-mono);
    margin: 12px 0 6px;
  }
  .empty {
    color: var(--text-dim);
    text-align: center;
    margin-top: 56px;
    font-size: 13px;
    line-height: 1.6;
  }
  #load-more {
    align-self: center;
    margin-bottom: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    padding: 7px 16px;
    border-radius: 8px;
    cursor: pointer;
    display: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #load-more:hover { background: var(--bg-hover); border-color: var(--accent-dim); }
  #load-more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div id="topbar">
    <h1>WhatsApp History Reader</h1>
    <div id="stats">loading stats…</div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div id="connstatus">
        <span class="dot"></span>
        <span id="connstatus-text">Checking connection…</span>
        <button id="qr-btn" style="display:none;" onclick="window.open('/qr', '_blank')">Scan QR to connect</button>
      </div>
      <div id="searchbox">
        <input id="search" type="text" placeholder="Search messages… (Enter)" autocomplete="off">
        <label id="filter-saved">
          <input type="checkbox" id="hide-saved-cb"> Hide saved contacts
        </label>
      </div>
      <div id="chatlist"><div class="empty">No chats yet</div></div>
    </div>
    <div id="panel">
      <div id="panel-header">Select a chat</div>
      <div id="messages">
        <div class="empty">Pick a chat from the sidebar, or search.</div>
      </div>
    </div>
  </div>

<script>
const PAGE_SIZE = 50;
let currentChat = null;
let currentOffset = 0;
let searchMode = false;

const $ = (id) => document.getElementById(id);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function fmtDate(ts) {
  if (!ts) return '';
  return new Date(ts * 1000).toLocaleDateString([], {
    year: 'numeric', month: 'short', day: 'numeric'
  });
}

function chatDisplayName(chat) {
  return chat.display_name || chat.name ||
    (chat.chat_pn ? '+' + chat.chat_pn : chat.id.replace(/@.*$/, ''));
}

function chatPnSuffix(chat) {
  // Show the number alongside the name when we know both
  if (!chat.chat_pn || !chat.display_name) return '';
  return '<span class="chat-pn">+' + esc(chat.chat_pn) + '</span>';
}

function senderLabel(m) {
  const name = m.sender_name;
  const pn = m.sender_pn ? '+' + m.sender_pn : null;
  if (name && pn) return name + ' · ' + pn;
  return name || pn || (m.sender_jid || '').replace(/@.*$/, '');
}

// Session-scoped in serve mode: forward ?sid= to every API call.
const SID = new URLSearchParams(location.search).get('sid');

async function fetchJSON(url) {
  if (SID) url += (url.includes('?') ? '&' : '?') + 'sid=' + encodeURIComponent(SID);
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ' -> ' + res.status);
  return res.json();
}

async function loadStats() {
  try {
    const s = await fetchJSON('/api/stats');
    const range = s.earliestMessage
      ? fmtDate(s.earliestMessage) + ' to ' + fmtDate(s.latestMessage)
      : 'no messages';
    $('stats').innerHTML =
      'chats <b>' + s.totalChats + '</b> · ' +
      'messages <b>' + s.totalMessages + '</b> · ' +
      'contacts <b>' + s.totalContacts + '</b> · ' +
      'range <b>' + esc(range) + '</b>';
  } catch (e) {
    $('stats').textContent = 'stats unavailable';
  }
}

async function loadChats() {
  try {
    const chats = await fetchJSON('/api/chats');
    const hideSaved = $('hide-saved-cb').checked;
    const visible = hideSaved ? chats.filter((c) => !c.is_saved) : chats;
    const list = $('chatlist');
    if (!visible.length) {
      list.innerHTML = '<div class="empty">' +
        (chats.length ? 'All chats are saved contacts (filtered)' : 'No chats yet') + '</div>';
      return;
    }
    list.innerHTML = visible.map((c) =>
      '<div class="chat-item' + (c.id === currentChat ? ' active' : '') +
      '" data-jid="' + esc(c.id) + '">' +
      '<div class="chat-name"><span class="chat-time">' + fmtTime(c.last_message_time) + '</span>' +
      esc(chatDisplayName(c)) + chatPnSuffix(c) + '</div>' +
      '<div class="chat-preview">' + esc(c.last_message_text || '') + '</div>' +
      '</div>'
    ).join('');
    list.querySelectorAll('.chat-item').forEach((el) => {
      el.addEventListener('click', () => openChat(el.dataset.jid, el.querySelector('.chat-name').textContent));
    });
  } catch (e) { /* server may be starting */ }
}

$('hide-saved-cb').addEventListener('change', loadChats);

function renderMessages(msgs, { append = false, chatLabel = null } = {}) {
  const container = $('messages');
  if (!append) container.innerHTML = '';
  if (!msgs.length && !append) {
    container.innerHTML = '<div class="empty">No messages</div>';
    return;
  }
  // API returns newest-first; display oldest-first
  const ordered = msgs.slice().reverse();
  let lastDay = append ? container.dataset.lastDay || '' : '';
  const frag = document.createDocumentFragment();
  for (const m of ordered) {
    const day = fmtDate(m.timestamp);
    if (day && day !== lastDay) {
      const sep = document.createElement('div');
      sep.className = 'date-sep';
      sep.textContent = day;
      frag.appendChild(sep);
      lastDay = day;
    }
    const div = document.createElement('div');
    div.className = 'msg ' + (m.is_from_me ? 'me' : 'other');
    let inner = '';
    if (!m.is_from_me) {
      inner += '<div class="sender">' + esc(senderLabel(m)) + '</div>';
    }
    if (chatLabel) {
      inner += '<div class="sender">in: ' + esc(m.chat_jid.replace(/@.*$/, '')) + '</div>';
    }
    if (m.message_type !== 'conversation' && m.message_type !== 'extendedTextMessage') {
      inner += '<span class="badge">' + esc(m.message_type.replace(/Message$/, '')) + '</span>';
    }
    inner += '<div>' + esc(m.message_text || '') + '</div>';
    inner += '<div class="time">' + fmtTime(m.timestamp) + '</div>';
    div.innerHTML = inner;
    frag.appendChild(div);
  }
  container.appendChild(frag);
  container.dataset.lastDay = lastDay;
  if (!append) container.scrollTop = container.scrollHeight;
}

async function openChat(jid, name) {
  currentChat = jid;
  currentOffset = 0;
  searchMode = false;
  $('panel-header').textContent = name || jid;
  try {
    const msgs = await fetchJSON('/api/chats/' + encodeURIComponent(jid) +
      '/messages?limit=' + PAGE_SIZE + '&offset=0');
    renderMessages(msgs);
    currentOffset = msgs.length;
  } catch (e) {
    $('messages').innerHTML = '<div class="empty">Failed to load messages</div>';
  }
  loadChats();
}

async function runSearch(q) {
  searchMode = true;
  currentChat = null;
  $('panel-header').textContent = 'Search: "' + q + '"';
  try {
    const msgs = await fetchJSON('/api/search?q=' + encodeURIComponent(q));
    renderMessages(msgs, { chatLabel: true });
  } catch (e) {
    $('messages').innerHTML = '<div class="empty">Search failed</div>';
  }
}

$('search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim();
    if (q) runSearch(q);
  }
  if (e.key === 'Escape') {
    e.target.value = '';
    searchMode = false;
  }
});

// Infinite scroll up: load older messages
$('messages').addEventListener('scroll', async (e) => {
  const el = e.target;
  if (searchMode || !currentChat || el.scrollTop > 50) return;
  try {
    const msgs = await fetchJSON('/api/chats/' + encodeURIComponent(currentChat) +
      '/messages?limit=' + PAGE_SIZE + '&offset=' + currentOffset);
    if (!msgs.length) return;
    currentOffset += msgs.length;
    const prevHeight = el.scrollHeight;
    const ordered = msgs.slice().reverse();
    const frag = document.createDocumentFragment();
    for (const m of ordered) {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.is_from_me ? 'me' : 'other');
      let inner = '';
      if (!m.is_from_me) {
        inner += '<div class="sender">' + esc(senderLabel(m)) + '</div>';
      }
      if (m.message_type !== 'conversation' && m.message_type !== 'extendedTextMessage') {
        inner += '<span class="badge">' + esc(m.message_type.replace(/Message$/, '')) + '</span>';
      }
      inner += '<div>' + esc(m.message_text || '') + '</div>';
      inner += '<div class="time">' + fmtTime(m.timestamp) + '</div>';
      div.innerHTML = inner;
      frag.appendChild(div);
    }
    el.prepend(frag);
    el.scrollTop = el.scrollHeight - prevHeight;
  } catch (err) { /* ignore */ }
});

async function loadConnStatus() {
  const box = $('connstatus');
  const text = $('connstatus-text');
  const btn = $('qr-btn');
  try {
    const s = await fetchJSON('/api/qr');
    if (s.offline) {
      box.classList.remove('connected');
      text.textContent = 'Offline, local data';
      btn.style.display = 'none';
    } else if (s.connected) {
      box.classList.add('connected');
      text.textContent = 'Connected';
      btn.style.display = 'none';
    } else {
      box.classList.remove('connected');
      text.textContent = 'Not connected';
      btn.style.display = 'inline-block';
    }
  } catch (e) {
    box.classList.remove('connected');
    text.textContent = 'Status unavailable';
    btn.style.display = 'none';
  }
}

loadStats();
loadChats();
loadConnStatus();
setInterval(() => { loadChats(); loadStats(); loadConnStatus(); }, 10000);
</script>
</body>
</html>
